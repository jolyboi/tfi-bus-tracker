plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mobilitydata:gtfs-realtime-bindings:0.0.8'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Local dev convenience: `./gradlew bootRun` loads application-local.yml so
// secrets (api-key, ntfy-url) come from there. The packaged jar (used in
// Docker / Fly) does NOT activate this profile, so production must supply
// TFI_API_KEY and NTFY_URL via env vars.
tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', 'local'
}
