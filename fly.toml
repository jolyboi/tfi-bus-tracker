# fly.toml app configuration file generated for tfi-bus-tracker on 2026-05-12T21:48:21+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tfi-bus-tracker'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine always-on so BusPollingScheduler's cron (every 30s,
  # 6am-11pm Dublin time) actually fires. Hibernation would silently break it.
  min_machines_running = 1
  processes = ['app']

# Persistent disk for the GTFS static CSVs. GtfsBootstrap downloads the
# 98 MB zip into this volume on first boot and the data survives restarts.
[mounts]
  source = 'gtfs_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
